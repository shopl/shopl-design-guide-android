name: SDG Builder preview
run-name: SDG Builder Android · ${{ inputs.source_branch || github.head_ref }} · ${{ inputs.source_sha || github.event.pull_request.head.sha }} · ${{ inputs.build_id || 'ci-review' }}
on:
  pull_request:
    paths: ['.github/workflows/sdg-builder-preview.yml', '.github/scripts/sdg-builder-validate.py', '.agents/skills/**', 'AGENTS.md']
  workflow_dispatch:
    inputs:
      source_sha: {required: true, type: string}
      source_branch: {required: true, type: string}
      source_base: {required: true, type: string}
      design_name: {required: true, type: string}
      build_id: {required: true, type: string}
permissions:
  contents: read
concurrency:
  group: sdg-builder-android-${{ inputs.source_branch || github.head_ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SDG_android: android
      SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha }}
      SOURCE_BASE: ${{ inputs.source_base }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      BUILD_ID: ${{ inputs.build_id }}
    steps:
      - name: Checkout trusted validation code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Save trusted source validator
        run: cp .github/scripts/sdg-builder-validate.py "$RUNNER_TEMP/sdg-builder-validate.py"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate dispatched source
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/sdg-builder-validate.py"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Build sample APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --console=plain
          mkdir -p preview-output
          cp app/build/outputs/apk/debug/app-debug.apk preview-output/sdg-builder.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdg-builder-android-${{ inputs.source_sha || github.event.pull_request.head.sha }}
          path: preview-output/
          if-no-files-found: error
          retention-days: 3
