name: shopl-design-guide-android-build
run-name: SDG Builder Android · ${{ inputs.source_branch }} · ${{ inputs.source_sha }} · ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      source_sha: {required: true, type: string}
      source_branch: {required: true, type: string}
      source_base: {required: true, type: string}
      design_name: {required: true, type: string}
      build_id: {required: true, type: string}

permissions:
  contents: read

concurrency:
  group: sdg-builder-android-${{ inputs.source_branch }}
  cancel-in-progress: true

jobs:
  # Slack 토큰은 앱 소스를 실행하지 않는 별도 GitHub-hosted 작업에만 전달한다.
  # #sdg-builder-build 채널(ID: C0CAC49CLH3). 시작 메시지 ID를 완료 알림에 넘긴다.
  notify-start:
    if: github.repository == 'shopl/shopl-design-guide-android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      thread_ts: ${{ steps.send.outputs.thread_ts }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Send build start to Slack
        id: send
        env:
          SDG_BUILDER_SLACK_TOKEN: ${{ secrets.SDG_BUILDER_SLACK_TOKEN }}
          SDG_NOTIFICATION_PHASE: started
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          DESIGN_NAME: ${{ inputs.design_name }}
        run: python3 .github/scripts/sdg-builder-slack.py

  build:
    needs: notify-start
    # 시작 알림 오류가 APK 빌드를 막지 않도록 한다.
    if: ${{ always() && !cancelled() && github.repository == 'shopl/shopl-design-guide-android' && github.ref == 'refs/heads/main' }}
    outputs:
      apk_url: ${{ steps.share_apk.outputs.download_url }}
    runs-on: [self-hosted, macOS, ARM64, shopl-android-qa]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_BASE: ${{ inputs.source_base }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      BUILD_ID: ${{ inputs.build_id }}
    steps:
      - name: Checkout trusted validation code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Save trusted source validator
        run: cp .github/scripts/sdg-builder-validate.py "$RUNNER_TEMP/sdg-builder-validate.py"

      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate dispatched source
        run: python3 "$RUNNER_TEMP/sdg-builder-validate.py"

      - name: Configure existing Mac build environment
        run: |
          set -euo pipefail
          sdg_java_home=/Library/Java/JavaVirtualMachines/amazon-corretto-21.jdk/Contents/Home
          if [ ! -x "$sdg_java_home/bin/java" ]; then
            sdg_java_home=$(/usr/libexec/java_home -v 21)
          fi
          sdg_android_home="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          if [ ! -d "$sdg_android_home/platforms/android-36" ]; then
            echo "Android SDK 36 is required on the SDG build runner." >&2
            exit 1
          fi
          command -v python3 >/dev/null
          echo "JAVA_HOME=$sdg_java_home" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdg_android_home" >> "$GITHUB_ENV"
          echo "$sdg_java_home/bin" >> "$GITHUB_PATH"
          echo "$sdg_android_home/platform-tools" >> "$GITHUB_PATH"
          "$sdg_java_home/bin/java" -version

      # 체크아웃은 정리하고, 러너의 Gradle User Home 캐시는 빌드 간 유지한다.
      - name: Build sample APK with local Gradle cache
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --build-cache --daemon --parallel --max-workers=4 --console=plain \
            2>&1 | tee "$RUNNER_TEMP/sdg-builder-android-build.log"
          mkdir -p preview-output
          cp app/build/outputs/apk/debug/app-debug.apk preview-output/sdg-builder.apk
          cp "$RUNNER_TEMP/sdg-builder-android-build.log" preview-output/build.log

      - name: Record source and cache results
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, re
          from pathlib import Path

          output = Path('preview-output')
          log = (output / 'build.log').read_text()
          hits = len(re.findall(r'^> Task .* FROM-CACHE$', log, re.MULTILINE))
          metadata = {
              'source_sha': os.environ['SOURCE_SHA'],
              'source_base': os.environ['SOURCE_BASE'],
              'source_branch': os.environ['SOURCE_BRANCH'],
              'build_id': os.environ['BUILD_ID'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'runner': os.environ['RUNNER_NAME'],
              'gradle_from_cache_tasks': hits,
              'apk_sha256': hashlib.sha256((output / 'sdg-builder.apk').read_bytes()).hexdigest(),
          }
          (output / 'build-metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"### SDG Android sample build\n\nCommit: `{metadata['source_sha']}`\n\n")
              summary.write(f"Gradle tasks restored from local cache: **{hits}**\n")
          PYTHON

      - name: Upload sample APK and build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdg-builder-android-${{ inputs.source_sha }}
          path: preview-output/
          if-no-files-found: error
          retention-days: 3

      # Shopl android-qa와 같은 Mac 공유 서버. SDG 전용 경로와 실행별 파일명으로 구분한다.
      - name: Copy APK to SDG shared folder
        id: share_apk
        continue-on-error: true
        run: |
          python3 - <<'PYTHON'
          import hashlib, os, re, shutil, tempfile
          from pathlib import Path
          from urllib.request import HTTPRedirectHandler, ProxyHandler, build_opener

          run_id, attempt, sha = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT'], os.environ['SOURCE_SHA']
          if not run_id.isdigit() or not attempt.isdigit() or not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Invalid APK identity')
          shares = [('/Users/spiderman/qa-apk-share', 'http://192.168.31.112:8080'),
                    ('/Users/gamora/qa-apk-share', 'http://192.168.31.113:8080')]
          available = [(Path(folder), url) for folder, url in shares if Path(folder).is_dir()]
          if len(available) != 1:
              raise SystemExit('Expected exactly one existing Shopl QA share directory')
          base, url = available[0]
          destination = base / 'sdg-builder'
          destination.mkdir(exist_ok=True)
          if destination.resolve().parent != base.resolve():
              raise SystemExit('Unexpected SDG share directory')
          filename = f'sdg-builder-{run_id}-{attempt}-{sha[:12]}.apk'
          target = destination / filename
          source = Path('preview-output/sdg-builder.apk')
          def digest(stream):
              result = hashlib.sha256()
              for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                  result.update(chunk)
              return result.hexdigest()
          with source.open('rb') as original:
              expected = digest(original)
          # 복사가 끝난 APK만 공개한다. 기존 파일은 덮어쓰거나 삭제하지 않는다.
          temporary = None
          try:
              with tempfile.NamedTemporaryFile(dir=destination, prefix='.sdg-', suffix='.tmp', delete=False) as staged:
                  temporary = Path(staged.name)
                  with source.open('rb') as original:
                      shutil.copyfileobj(original, staged)
                  staged.flush()
                  os.fsync(staged.fileno())
              temporary.chmod(0o644)
              os.link(temporary, target)
          finally:
              if temporary is not None:
                  temporary.unlink(missing_ok=True)

          download_url = f'{url}/sdg-builder/{filename}'
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, file, code, message, headers, new_url):
                  raise RuntimeError('APK share redirected unexpectedly')
          # 프록시·다른 호스트로 넘기지 않고 사내 서버가 실제 제공하는 APK를 대조한다.
          opener = build_opener(ProxyHandler({}), NoRedirect())
          with opener.open(download_url, timeout=20) as response:
              actual = digest(response)
          if actual != expected:
              raise SystemExit('Shared HTTP APK does not match the built APK')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'download_url={download_url}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## SDG APK share verified\nSHOPL_DEV network required. HTTP APK SHA-256 matches the build.\n')
          PYTHON

  # 완료·실패·취소는 가능하면 시작 메시지의 스레드로 보낸다.
  notify-slack:
    needs: [notify-start, build]
    if: ${{ always() && github.repository == 'shopl/shopl-design-guide-android' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Send build result to Slack
        env:
          SDG_BUILDER_SLACK_TOKEN: ${{ secrets.SDG_BUILDER_SLACK_TOKEN }}
          SDG_NOTIFICATION_PHASE: finished
          SDG_SLACK_THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          SDG_BUILD_RESULT: ${{ needs.build.result }}
          SDG_APK_URL: ${{ needs.build.outputs.apk_url }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          DESIGN_NAME: ${{ inputs.design_name }}
        run: python3 .github/scripts/sdg-builder-slack.py
